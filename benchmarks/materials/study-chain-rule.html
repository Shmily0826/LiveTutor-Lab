<h1>链式法则：复合函数求导</h1>
<p>本页是 LiveTutor-Lab 的人工编写测试材料，标记 NEKO-LAB-20261008。</p>
<p>当 y = f(u)，u = g(x) 时，<strong>dy/dx = (dy/du) × (du/dx)</strong>。</p>
<p>例题：<code>y = sin(x²)</code>。内层 u = x²，外层 y = sin(u)。</p>
<p>外层导数是 cos(u)，内层导数是 2x，所以 <code>y′ = 2x cos(x²)</code>。</p>
<p>常见错误：只求外层，写成 cos(x²)，漏掉内层导数 2x。</p>
<p>请先解释两层如何相乘，再给出一道不同的复合函数练习题。</p>
