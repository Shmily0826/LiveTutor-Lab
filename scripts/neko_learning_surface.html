<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N.E.K.O · 学习材料</title>
<link rel="icon" href="data:,">
<style>
:root {color-scheme:dark;--bg:#13191f;--panel:#1e2730;--ink:#f3f5f7;--muted:#bfccd8;--accent:#9cddd2;--line:#435363}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
::selection{background:var(--accent);color:var(--bg)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0;white-space:nowrap}header p{margin:0;color:var(--muted)}
main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{padding:24px;border-right:1px solid var(--line)}label{display:block;margin-bottom:7px;font-weight:600}select,button{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-height:42px;padding:9px 12px;max-width:100%}select{width:100%;margin-bottom:20px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.hint{color:var(--muted);font-size:13px}.status{font-size:14px;min-height:64px;margin-top:28px;overflow-wrap:anywhere}.workspace{min-width:0;padding:16px;position:relative}.surface{position:relative;height:calc(100vh - 108px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg)}iframe{border:0;width:100%;height:100%;display:block}#imageScroll{height:100%;overflow:auto;scrollbar-color:var(--line) var(--bg)}#image{display:block;width:100%;height:auto;max-width:none;cursor:crosshair}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}#marker{fill:#00917a26;stroke:#00917a;stroke-width:3;vector-effect:non-scaling-stroke}#arrow{fill:none;stroke:#00917a;stroke-width:3;stroke-linecap:round}#targetCaption{margin:12px 0 0;min-height:22px;color:var(--accent)}[hidden]{display:none!important}
@media(max-width:760px){header{align-items:flex-start;gap:8px;flex-direction:column;padding:16px}main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:16px}aside .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}select{margin-bottom:0}.status{margin-top:8px;min-height:24px}.actions{margin:12px 0}.workspace{padding:12px}.surface{height:60vh;min-height:380px}}
</style>
<header><h1>N.E.K.O 学习材料</h1><p>一起看清正在讲的地方。材料由你操作，伙伴只做指示。</p></header>
<main>
<aside>
  <p id="studyContext" class="hint" hidden></p>
  <div class="fields"><div><label for="materials">当前材料</label><select id="materials" disabled><option>正在载入…</option></select></div>
  <div><label for="targets">指向模块或连线</label><select id="targets" disabled><option>先选择材料</option></select></div></div>
  <div class="actions"><button id="point" class="primary" disabled>指向这里</button><button id="clear" disabled>清除指示</button></div>
  <label for="zoom">图片缩放</label><select id="zoom" disabled><option value="1">适应宽度</option><option value="1.5">150%</option><option value="2">200%</option></select>
  <p id="help" class="hint">HTML 可选择原图的模块和连线。图片可点击一个位置。缩放或滚动后指示随材料移动。</p>
  <button id="reload">重新载入材料</button>
  <p id="status" class="status" role="status" aria-live="polite">正在准备学习窗口…</p>
</aside>
<section class="workspace" aria-label="只读学习材料与指示">
  <div id="surface" class="surface"><p id="empty" class="hint" style="padding:24px;max-width:65ch" hidden></p><iframe id="frame" title="原始学习材料" sandbox="allow-scripts allow-same-origin" hidden></iframe><div id="imageScroll" hidden><img id="image" alt="当前学习图片"></div>
    <svg id="overlay" aria-hidden="true"><g id="marks" hidden><rect id="marker" rx="5"></rect><path id="arrow"></path></g></svg>
  </div><p id="targetCaption">选择材料后开始。</p>
</section>
</main>
<script>
'use strict';
const BOOT = __BOOTSTRAP__;
const $ = id => document.getElementById(id);
const ui = Object.fromEntries(['materials','targets','point','clear','zoom','reload','status','help','surface','frame','image','imageScroll','overlay','marks','marker','arrow','targetCaption','studyContext','empty'].map(id=>[id,$(id)]));
let state=null,current=null,command=null,revision=-1,ready=false,connected=false;
async function api(route,payload){const response=await fetch(route,{method:payload?'POST':'GET',headers:{'X-Learning-Surface-Token':BOOT.token,'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});const body=await response.json();if(!response.ok)throw Error(body.error||'学习窗口暂时不可用');return body}
function say(text){if(ui.status.textContent!==text)ui.status.textContent=text}
function clearLocal(){command=null;ui.marks.setAttribute('hidden','');ui.clear.disabled=true;ui.targetCaption.textContent='当前没有指示。'}
function collectTargets(){
  const doc=ui.frame.contentDocument;const elements=doc.querySelectorAll('[data-node-id],[data-edge-id],[data-line]');
  ui.targets.replaceChildren();
  for(const element of elements){let attr=['data-node-id','data-edge-id','data-line'].find(a=>element.hasAttribute(a));let id=element.getAttribute(attr);let label=attr==='data-edge-id'?`${element.getAttribute('data-edge-from')} → ${element.getAttribute('data-edge-to')} · ${element.getAttribute('data-edge-label')||id}`:element.getAttribute('data-node-label')||element.textContent.trim().replace(/\s+/g,' ').slice(0,90)||id;const option=new Option(label,`[${attr}="${CSS.escape(id)}"]`);ui.targets.add(option)}
  if(!elements.length)ui.targets.add(new Option('没有可识别的模块或代码行',''));
  ui.targets.disabled=!elements.length;ui.point.disabled=!elements.length;
}
function loaded(){if(!current)return;if(current.kind==='html'&&ui.frame.contentWindow.location.pathname!==current.url)return;if(current.kind==='image'&&(!ui.image.naturalWidth||new URL(ui.image.currentSrc).pathname!==current.url))return;ready=true;ui.clear.disabled=!command;say('材料已就绪。选择目标，或在图片上点击一个位置。');ui.targetCaption.textContent='已载入 '+current.name; if(current.kind==='html')collectTargets()}
function choose(id){
  current=state.materials.find(m=>m.id===id);clearLocal();ready=false;ui.targets.disabled=true;ui.point.disabled=true;ui.zoom.disabled=true;
  ui.empty.hidden=!!current;
  if(!current){current=null;ui.frame.hidden=true;ui.imageScroll.hidden=true;ui.frame.removeAttribute('src');ui.image.removeAttribute('src');ui.targets.replaceChildren(new Option('暂无图片可指示',''));const message=state.study?.message||'请选择学习材料。';ui.empty.textContent=message;say(message);return}
  ui.targets.replaceChildren(new Option(current.kind==='html'?'正在读取模块…':'点击图片选择位置',''));
  ui.frame.hidden=current.kind!=='html';ui.imageScroll.hidden=current.kind!=='image';say('正在载入 '+current.name+'…');
  if(current.kind==='html'){ui.frame.onload=loaded;ui.frame.src=current.url+'?theme=dark';ui.image.removeAttribute('src')}
  else{ui.frame.removeAttribute('src');ui.image.onload=loaded;ui.image.onerror=()=>{ready=false;clearLocal();say('图片未能载入，请重新载入材料。')};ui.image.style.width='100%';ui.zoom.value='1';ui.zoom.disabled=false;ui.image.src=current.url}
}
function apply(next){
  if(next.revision<revision)return; // A late earlier request cannot restore an old picture.
  state=next;
  const exists=current&&state.materials.some(m=>m.id===current.id);
  const choices=state.study?[{id:'@study',name:'跟随当前 Study 图片'},...state.materials.filter(m=>m.source!=='study_store_snapshot').map(m=>({...m,name:'参考 · '+m.name}))]:state.materials;
  if(ui.materials.options.length!==choices.length||[...ui.materials.options].some((option,i)=>option.value!==choices[i]?.id||option.textContent!==choices[i]?.name)){ui.materials.replaceChildren(...choices.map(m=>new Option(m.name,m.id)));ui.materials.disabled=!choices.length}
  ui.studyContext.hidden=!state.study;
  if(state.study)ui.studyContext.textContent=(state.study.following?'跟随 Study · ':'查看参考材料 · Study 当前课程：')+(state.study.course_id||'暂不可用');
  if(!exists){choose(state.active_material_id)}
  else if(current.id!==state.active_material_id)choose(state.active_material_id);
  ui.materials.value=state.study?.following?'@study':(current?.id||'');
  if(next.revision!==revision){revision=next.revision;if(next.command&&next.command.material_id===current?.id){command=next.command;ui.clear.disabled=false;ui.targetCaption.textContent=command.label}else clearLocal()}
}
async function send(value){try{apply(await api('/api/guidance',value))}catch(error){clearLocal();say(error.message)}}
ui.materials.onchange=async()=>{clearLocal();try{apply(await api('/api/select',{material_id:ui.materials.value}))}catch(error){say(error.message)}};
ui.point.onclick=()=>{const selector=ui.targets.value;if(!selector)return;const target=ui.frame.contentDocument.querySelector(selector);target?.scrollIntoView({block:'center',inline:'center',behavior:'instant'});send({material_id:current.id,kind:'selector',selector,label:ui.targets.selectedOptions[0].textContent})};
ui.image.onclick=event=>{if(!current||!ready)return;const r=ui.image.getBoundingClientRect();const x=Math.max(0,Math.min(.96,(event.clientX-r.left)/r.width-.02));const y=Math.max(0,Math.min(.96,(event.clientY-r.top)/r.height-.02));send({material_id:current.id,kind:'rect',x,y,width:.04,height:.04,label:'你选择的图片位置'})};
ui.zoom.onchange=()=>{ui.image.style.width=(Number(ui.zoom.value)*100)+'%'};
ui.clear.onclick=()=>send({material_id:current.id,kind:'clear'});
ui.reload.onclick=async()=>{ui.reload.disabled=true;try{apply(await api('/api/reload',{}))}catch(error){say(error.message)}finally{ui.reload.disabled=false}};
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&current)ui.clear.click()});
function geometry(){
  if(!current||!command||!ready||command.material_id!==current.id)return null;
  const surface=ui.surface.getBoundingClientRect();let r,clip;
  if(command.kind==='selector'){
    let target;try{target=ui.frame.contentDocument.querySelector(command.selector)}catch{say('目标选择器无效，请重新选择目标。');return null}
    if(!target){say('目标已不在当前材料中，请重新选择。');return null}
    const frame=ui.frame.getBoundingClientRect(),b=target.getBoundingClientRect();const style=ui.frame.contentWindow.getComputedStyle(target);
    if(style.display==='none'||style.visibility==='hidden')return null;
    r={x:frame.left+b.left-surface.left-1,y:frame.top+b.top-surface.top-1,width:b.width,height:b.height};
    clip={x:frame.left-surface.left-1,y:frame.top-surface.top-1,width:frame.width,height:frame.height};
    for(let parent=target.parentElement;parent;parent=parent.parentElement){const s=ui.frame.contentWindow.getComputedStyle(parent);const p=parent.getBoundingClientRect();const left=frame.left+p.left-surface.left-1,top=frame.top+p.top-surface.top-1;if(/hidden|scroll|auto|clip/.test(s.overflowX)){const end=Math.min(clip.x+clip.width,left+p.width);clip.x=Math.max(clip.x,left);clip.width=end-clip.x}if(/hidden|scroll|auto|clip/.test(s.overflowY)){const end=Math.min(clip.y+clip.height,top+p.height);clip.y=Math.max(clip.y,top);clip.height=end-clip.y}}
  }else{const b=ui.image.getBoundingClientRect();r={x:b.left-surface.left-1+command.x*b.width,y:b.top-surface.top-1+command.y*b.height,width:command.width*b.width,height:command.height*b.height};clip={x:0,y:0,width:ui.surface.clientWidth,height:ui.surface.clientHeight}}
  // Fully off-screen or clipped targets are hidden rather than pointed at wrongly.
  if(r.x<clip.x||r.y<clip.y||r.x+r.width>clip.x+clip.width||r.y+r.height>clip.y+clip.height){say('目标在可见区域外。请滚动材料后继续。');return null}
  return r;
}
function draw(){const r=geometry();ui.marks.toggleAttribute('hidden',!r);if(r){for(const [a,v] of Object.entries({x:r.x-4,y:r.y-4,width:Math.max(8,r.width+8),height:Math.max(8,r.height+8)}))ui.marker.setAttribute(a,v);const x=Math.max(12,r.x-30),y=Math.max(12,r.y-26);const ex=r.x+Math.min(16,r.width/2),ey=r.y;ui.arrow.setAttribute('d',`M ${x} ${y} L ${ex} ${ey} M ${ex-8} ${ey-2} L ${ex} ${ey} L ${ex-2} ${ey-8}`);say('正在指示：'+command.label)} }
// Geometry is sampled only while a pointer is active; this includes SVG pan/zoom
// transforms and iframe scrolling without changing the material's DOM.
setInterval(()=>{if(command&&!document.hidden)draw()},100);
let polling=false;
async function poll(){if(polling)return;polling=true;try{const next=await api('/api/state');if(!connected)say('学习窗口连接已恢复。');connected=true;apply(next)}catch(error){connected=false;clearLocal();ready=false;ui.frame.hidden=true;ui.imageScroll.hidden=true;current=null;ui.empty.hidden=false;ui.empty.textContent='学习窗口连接中断。恢复服务后会自动重连；也可重新载入。';say(ui.empty.textContent)}finally{polling=false}}
poll();setInterval(poll,750);
window.learningSurface={geometry,get command(){return command},get material(){return current},get ready(){return ready},send,draw};
</script>
</html>
